<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reyzha - Proyek dan Dukungan</title>
<meta name="description" content="Tautan proyek GitHub dan dukungan Saweria Muhammad Yusuf Reyzha Rizky.">
<meta property="og:title" content="Reyzha - Proyek dan Dukungan">
<meta property="og:description" content="Tautan proyek GitHub dan dukungan Saweria.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rezariski42.github.io/link/">
<meta property="og:image" content="https://github.com/rezariski42.png">
<link rel="icon" href="https://github.com/rezariski42.png" type="image/png">
<style>
  :root {
    --bg: #0a0d14;
    --card: #111723;
    --card-hover: #161f30;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --radius: 12px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  .shell {
    width: min(440px, 100%);
    margin: 0 auto;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 28px;
  }

  .wordmark {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .top a {
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: none;
    padding: 10px 2px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }

  .top a:hover {
    color: var(--text);
    border-bottom-color: var(--border-strong);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .intro { margin-bottom: 28px; }

  .avatar {
    display: block;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--border);
    object-fit: cover;
    margin-bottom: 18px;
  }

  /* Short amber rule: one carry-over cue from the portfolio, nothing else glows. */
  .intro::before {
    content: "";
    display: block;
    width: 28px;
    height: 2px;
    background: var(--accent);
    margin-bottom: 20px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    line-height: 1.2;
    letter-spacing: -0.015em;
    font-weight: 650;
  }

  .role {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .label {
    margin: 0 0 10px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 68px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .row:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .row:active { background: var(--card); }

  .row-name {
    display: block;
    font-size: 1rem;
    font-weight: 600;
  }

  .row-meta {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .row-action {
    flex: none;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
  }

  .row:hover .row-action { text-decoration: underline; text-underline-offset: 4px; }

  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.75rem;
  }

  footer p { margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .row { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="wordmark">Reyzha</span>
    <nav aria-label="Navigasi utama">
      <a href="https://rezariski42.github.io/">Portfolio</a>
    </nav>
  </header>

  <main>
    <div class="intro">
      <img class="avatar" src="https://github.com/rezariski42.png" alt="Foto Muhammad Yusuf Reyzha Rizky" width="64" height="64" fetchpriority="high">
      <h1>Muhammad Yusuf Reyzha Rizky</h1>
      <p class="role">Network Engineer, IT Operations, Developer</p>
    </div>

    <p class="label" id="tautan">Tautan</p>
    <ul class="links" aria-labelledby="tautan">
      <li>
        <a class="row" href="https://github.com/rezariski42">
          <span>
            <span class="row-name">GitHub</span>
            <span class="row-meta">github.com/rezariski42</span>
          </span>
          <span class="row-action">Lihat</span>
        </a>
      </li>
      <li>
        <a class="row" href="https://saweria.co/rezariski42">
          <span>
            <span class="row-name">Saweria</span>
            <span class="row-meta">saweria.co/rezariski42</span>
          </span>
          <span class="row-action">Dukung</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <p>Halaman statis, tanpa pelacak.</p>
  </footer>
</div>
</body>
</html>
